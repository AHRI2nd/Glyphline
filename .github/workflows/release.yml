name: Release

# Triggered by pushing a version tag (e.g. `v0.2.0`). Builds, code-signs, and
# (if notarization secrets are configured) notarizes native/scripts/release.sh
# unchanged — this workflow's only job is to get a signing certificate and
# notary credentials into the runner first, then hand off to the exact same
# script a maintainer runs locally, so the two paths can never drift apart.
#
# Required repo secrets for a fully signed build:
#   MACOS_CERTIFICATE          - `Developer ID Application` cert, exported as
#                                 .p12 and base64-encoded
#                                 (base64 -i cert.p12 | pbcopy)
#   MACOS_CERTIFICATE_PWD      - the .p12's export password
#   CI_KEYCHAIN_PASSWORD       - any password; only used for the throwaway
#                                 keychain this workflow creates on the runner
# Additionally required for notarization (optional — the build still
# produces a signed-but-unnotarized .app without these):
#   NOTARIZE_APPLE_ID          - Apple ID email with access to the team
#   NOTARIZE_TEAM_ID           - Developer Team ID
#   NOTARIZE_APP_PASSWORD      - an app-specific password for that Apple ID
#     (generate at https://account.apple.com/account/manage → Sign-In and
#     Security → App-Specific Passwords)
#
# Without MACOS_CERTIFICATE/MACOS_CERTIFICATE_PWD set at all, this workflow
# still builds the .app but skips codesigning entirely (release.sh's own
# codesign step would fail against an empty identity) — see the "Skip
# signing" guard below.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Swift toolchain version
        run: swift --version

      - name: Test
        run: swift test

      - name: Import signing certificate
        if: ${{ secrets.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          EXISTING=$(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notarization credentials
        if: ${{ secrets.NOTARIZE_APPLE_ID != '' }}
        env:
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
          NOTARIZE_APP_PASSWORD: ${{ secrets.NOTARIZE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "glyphline-notary" \
            --apple-id "$NOTARIZE_APPLE_ID" \
            --team-id "$NOTARIZE_TEAM_ID" \
            --password "$NOTARIZE_APP_PASSWORD"

      - name: Build (unsigned)
        if: ${{ secrets.MACOS_CERTIFICATE == '' }}
        run: swift build -c release

      - name: Build, sign, and notarize
        if: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.NOTARIZE_APPLE_ID != '' }}
        run: ./scripts/release.sh --notarize

      - name: Build and sign (no notarization credentials configured)
        if: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.NOTARIZE_APPLE_ID == '' }}
        run: ./scripts/release.sh

      - name: Package
        run: |
          cd .build
          if [ -d Glyphline-release.app ]; then
            ditto -c -k --keepParent Glyphline-release.app "Glyphline-${{ github.ref_name }}.zip"
          else
            # Unsigned fallback path — release.sh wasn't run, so assemble the
            # same layout it would have from the plain `swift build` output.
            mkdir -p "Glyphline-unsigned.app/Contents/MacOS"
            cp "release/Glyphline" "Glyphline-unsigned.app/Contents/MacOS/Glyphline"
            cp "../scripts/Info.plist" "Glyphline-unsigned.app/Contents/Info.plist"
            ditto -c -k --keepParent "Glyphline-unsigned.app" "Glyphline-${{ github.ref_name }}.zip"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: native/.build/Glyphline-*.zip
          generate_release_notes: true
          draft: true
