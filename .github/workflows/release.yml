name: Release

# Triggered by pushing a version tag (e.g. `v0.2.0`). Builds, code-signs, and
# (if notarization secrets are configured) notarizes native/scripts/release.sh
# unchanged — this workflow's only job is to get a signing certificate and
# notary credentials into the runner first, then hand off to the exact same
# script a maintainer runs locally, so the two paths can never drift apart.
#
# Required repo secrets for a fully signed build:
#   MACOS_CERTIFICATE          - `Developer ID Application` cert, exported as
#                                 .p12 and base64-encoded
#                                 (base64 -i cert.p12 | pbcopy)
#   MACOS_CERTIFICATE_PWD      - the .p12's export password
#   CI_KEYCHAIN_PASSWORD       - any password; only used for the throwaway
#                                 keychain this workflow creates on the runner
# Additionally required for notarization (optional — the build still
# produces a signed-but-unnotarized .app without these):
#   NOTARIZE_APPLE_ID          - Apple ID email with access to the team
#   NOTARIZE_TEAM_ID           - Developer Team ID
#   NOTARIZE_APP_PASSWORD      - an app-specific password for that Apple ID
#     (generate at https://account.apple.com/account/manage → Sign-In and
#     Security → App-Specific Passwords)
#
# Without MACOS_CERTIFICATE/MACOS_CERTIFICATE_PWD set at all, this workflow
# still builds the .app but skips codesigning entirely (release.sh's own
# codesign step would fail against an empty identity) — see the "Skip
# signing" guard below.
#
# Optional, for Sparkle in-app auto-updates (see native/Sources/Glyphline/App.swift):
#   SPARKLE_ED_PRIVATE_KEY      - the EdDSA private key exported via
#                                 `generate_keys -x <file>` (see that file's
#                                 contents — NOT the file path). Without this
#                                 secret, the release still builds and
#                                 publishes; appcast.xml is simply left
#                                 unsigned/unupdated, so existing installs
#                                 won't see the new version until it's set.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: macos-latest
    # `secrets` isn't a valid context inside step `if:` conditionals (GitHub
    # rejects it at parse time: "Unrecognized named-value: 'secrets'") — it's
    # only readable from `env:`. So mirror the two secrets we branch on into
    # job-level env vars here, and check those in `if:` instead.
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE }}
      HAS_NOTARY_CREDS: ${{ secrets.NOTARIZE_APPLE_ID }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Swift toolchain version
        run: swift --version

      - name: Test
        run: swift test

      - name: Derive version from tag
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Import signing certificate
        if: ${{ env.HAS_CERT != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          EXISTING=$(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notarization credentials
        if: ${{ env.HAS_NOTARY_CREDS != '' }}
        env:
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
          NOTARIZE_APP_PASSWORD: ${{ secrets.NOTARIZE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "glyphline-notary" \
            --apple-id "$NOTARIZE_APPLE_ID" \
            --team-id "$NOTARIZE_TEAM_ID" \
            --password "$NOTARIZE_APP_PASSWORD"

      - name: Build (unsigned)
        if: ${{ env.HAS_CERT == '' }}
        run: swift build -c release

      - name: Build, sign, and notarize
        if: ${{ env.HAS_CERT != '' && env.HAS_NOTARY_CREDS != '' }}
        run: ./scripts/release.sh --notarize --version="$APP_VERSION"

      - name: Build and sign (no notarization credentials configured)
        if: ${{ env.HAS_CERT != '' && env.HAS_NOTARY_CREDS == '' }}
        run: ./scripts/release.sh --version="$APP_VERSION"

      - name: Package
        run: |
          cd .build
          if [ -d Glyphline-release.app ]; then
            ditto -c -k --keepParent Glyphline-release.app "Glyphline-${{ github.ref_name }}.zip"
          else
            # Unsigned fallback path — release.sh wasn't run, so assemble the
            # same layout it would have from the plain `swift build` output.
            mkdir -p "Glyphline-unsigned.app/Contents/MacOS"
            cp "release/Glyphline" "Glyphline-unsigned.app/Contents/MacOS/Glyphline"
            cp "../scripts/Info.plist" "Glyphline-unsigned.app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "Glyphline-unsigned.app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_VERSION" "Glyphline-unsigned.app/Contents/Info.plist"
            ditto -c -k --keepParent "Glyphline-unsigned.app" "Glyphline-${{ github.ref_name }}.zip"
          fi

      - name: Generate and sign appcast
        if: ${{ env.HAS_SPARKLE_KEY != '' }}
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # A separate worktree of `main`, fully isolated from the tag checkout
          # this job builds from — appcast.xml is published on main, not on
          # release tags, and this step must never switch the primary
          # checkout's branch mid-build.
          git worktree add "$RUNNER_TEMP/main-wt" origin/main

          ARCHIVE_DIR="$RUNNER_TEMP/appcast-src"
          mkdir -p "$ARCHIVE_DIR"
          cp .build/Glyphline-*.zip "$ARCHIVE_DIR/"
          # Carry forward existing entries/signatures so old installs still on
          # an older version keep seeing their update path (first-ever release
          # has no appcast.xml on main yet, so this is skipped then).
          if [ -f "$RUNNER_TEMP/main-wt/appcast.xml" ]; then
            cp "$RUNNER_TEMP/main-wt/appcast.xml" "$ARCHIVE_DIR/appcast.xml"
          fi

          # Path comes from SPM's own artifact resolution for the Sparkle
          # binaryTarget pinned in Package.swift (verified locally against the
          # actual .build tree when this step was written) — re-check with
          # `find .build/artifacts -iname generate_appcast` if the pinned
          # Sparkle version ever changes and this step starts failing.
          echo "$SPARKLE_ED_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
            "$ARCHIVE_DIR"

          cp "$ARCHIVE_DIR/appcast.xml" "$RUNNER_TEMP/main-wt/appcast.xml"
          cd "$RUNNER_TEMP/main-wt"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast.xml unchanged, nothing to commit"
          else
            git commit -m "Update appcast.xml for ${{ github.ref_name }}"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: native/.build/Glyphline-*.zip
          generate_release_notes: true
          draft: true
